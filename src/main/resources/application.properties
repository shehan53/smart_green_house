# Author: Role 5 - Timing & Integration Lead
# Purpose: Spring Boot settings. Spring's own logging is kept quiet so the CLI shows only
#          the greenhouse events (our Log class prints them with millisecond timestamps).

server.port=8080
spring.main.banner-mode=off
logging.level.root=WARN

# Pretty JSON for Postman, accept "dead" as well as "DEAD"
spring.jackson.serialization.indent-output=true
spring.jackson.mapper.accept-case-insensitive-enums=true

# Console fault menu (F1-F5) - required by the assignment, optional when using Postman
greenhouse.menu.enabled=true
